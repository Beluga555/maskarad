<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ссылки гостям</title>
<meta name="robots" content="noindex">
<style>
body{font-family:system-ui,sans-serif;background:#111;color:#eee;margin:0;padding:24px 16px;max-width:760px;margin:auto}
h1{font-size:20px}
textarea{width:100%;min-height:220px;background:#000;color:#eee;border:1px solid #444;border-radius:8px;padding:10px;font:15px/1.5 system-ui;box-sizing:border-box}
button{font:inherit;padding:10px 16px;border-radius:8px;border:none;background:#a8202b;color:#fff;cursor:pointer;margin-top:10px}
.item{margin:14px 0;padding:12px;border:1px solid #333;border-radius:8px}
.item b{display:block;margin-bottom:6px}
.item input{width:100%;background:#000;color:#9cf;border:1px solid #333;padding:8px;border-radius:6px;box-sizing:border-box}
small{color:#888}
</style>
</head>
<body>
<h1>Личные ссылки на приглашение</h1>
<p><small>Каждая строка: <code>Официальное обращение | личная строка внутри письма</code>. Строку можно не писать. Ничего не сохраняется и никуда не отправляется — всё считается прямо в браузере.</small></p>
<textarea id="list" placeholder="Милостивый государь Сергей | ...&#10;Милостивая государыня Вероника | ..."></textarea>
<button id="go">Сделать ссылки</button>
<div id="out"></div>
<script>
const base = location.href.replace(/gen\.html.*$/, "");
function enc(o){
  const bytes = new TextEncoder().encode(JSON.stringify(o));
  let s = ""; bytes.forEach(b => s += String.fromCharCode(b));
  return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
}
document.getElementById("go").onclick = () => {
  const out = document.getElementById("out"); out.innerHTML = "";
  document.getElementById("list").value.split("\n").map(s => s.trim()).filter(Boolean).forEach(line => {
    const [n, ...rest] = line.split("|");
    const o = {s: n.trim()}; const x = rest.join("|").trim(); if (x) o.x = x;
    const url = base + "#" + enc(o);
    const d = document.createElement("div"); d.className = "item";
    d.innerHTML = "<b></b><input readonly><button>Копировать</button>";
    d.querySelector("b").textContent = o.s;
    d.querySelector("input").value = url;
    d.querySelector("button").onclick = () => navigator.clipboard.writeText(url);
    out.appendChild(d);
  });
};
</script>
</body>
</html>
